<mat-card class="mb-15 border-radius d-block bg-white border-0 shadow-none">
  <div class="account-settings-card">
    <div class="d-flex justify-content-between align-items-center">
      <h5>
        Profile
      </h5>
      <div class="btn-box">
        <button class="add-btn" mat-button color="primary" *ngIf="readonly" (click)="updateEditMode()">
          <i class="material-symbols-outlined">edit</i>
          <span i18n="@@edit">Edit</span>
        </button>
        <div *ngIf="!readonly">
          <button class="add-btn  mlr-5" type="button" mat-button color="primary" (click)="saveProfile()">
            <i class="material-symbols-outlined">save</i>
            <span i18n="@@save">Save</span>
          </button>
          <button class="mlr-5 close-btn" mat-button type="button" (click)="onCancel()">
            <i class="material-symbols-outlined">close</i>
            <span i18n="@@cancel">Cancel</span>
          </button>
        </div>
      </div>
    </div>
    <div class="row mt-10 justify-content-center align-items-start">
      <div class="col-md-2 col-sm-12 text-center">
        <div class="file-upload-container">
          <img *ngIf="avatarUrl" [src]="avatarUrl" alt="User avatar" class="avatar-preview"/>
          <img *ngIf="!avatarUrl" src="images/admin.png" alt="User avatar" class="avatar-preview"/>
          <input type="file" *ngIf="!readonly" (change)="onFileSelected($event)" accept="image/*"/>
          <!--          <file-upload *ngIf="!readonly" [multiple]="false" class="file-uploader" accept="image/*"-->
          <!--                       (change)="onFileSelected($event)"></file-upload>-->
          <mat-error *ngIf="fileError">{{ fileError }}</mat-error>
        </div>
      </div>
      <div class="col-md-10 col-sm-12">
        <form ngForm [formGroup]="formGroup" autocomplete="off">
          <div class="row col-md-8">
            <div class="col-sm-12 mb-10">
              <div class="form-group">
                <app-input
                  sizeInput="lg"
                  formControlName="department"
                  label="Department"
                  [readonly]="readonly"
                  [required]="true"
                  [maxLength]="200"
                ></app-input>
              </div>
            </div>
            <div class="col-sm-12 mb-10">
              <div class="form-group">
                <app-input
                  sizeInput="lg"
                  formControlName="fullName"
                  label="Full name"
                  [readonly]="readonly"
                  [required]="true"
                  [maxLength]="200"
                ></app-input>
              </div>
            </div>
            <div class="col-sm-12 mb-10">
              <div class="form-group">
                <app-selection
                  sizeInput="lg"
                  formControlName="gender"
                  [label]="'Gender'"
                  [required]="false"
                  [readonly]="readonly"
                  [options]="genderOptions"
                ></app-selection>
              </div>
            </div>
            <div class="col-sm-12 mb-10">
              <div class="form-group">
                <app-input
                  sizeInput="lg"
                  formControlName="email"
                  label="Email"
                  type="text"
                  [readonly]="true"
                  [required]="true"
                  [maxLength]="200"
                ></app-input>
              </div>
            </div>
            <div class="col-sm-12 mb-10">
              <div class="form-group">
                <app-input
                  sizeInput="lg"
                  formControlName="phone"
                  label="Phone"
                  [readonly]="readonly"
                  [required]="false"
                  [maxLength]="20"
                ></app-input>
              </div>
            </div>
            <div class="col-sm-12 mb-10">
              <div class="form-group">
                <app-input
                  sizeInput="lg"
                  formControlName="description"
                  label="Description"
                  [readonly]="readonly"
                  [required]="false"
                  [maxLength]="500"
                ></app-input>
              </div>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>
</mat-card>
