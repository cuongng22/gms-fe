<mat-card class="mb-15 border-radius d-block bg-white border-0 shadow-none">
  <div class="account-settings-card">
    <div class="d-flex justify-content-between align-items-center">
      <h5>
        Profile
      </h5>
      <div>
        <button class="add-btn" mat-button color="primary" *ngIf="!isEditMode" (click)="updateEditMode()">
          <i class="material-symbols-outlined">edit</i>
          <span i18n="@@edit">Edit</span>
        </button>
        <div *ngIf="isEditMode">
          <button class="add-btn  mlr-5" mat-button color="primary" (click)="saveProfile()">
            <i class="material-symbols-outlined">save</i>
            <span i18n="@@save">Save</span>
          </button>
          <button class="danger-btn   mlr-5" mat-button (click)="onCancel()">
            <i class="material-symbols-outlined">cancel</i>
            <span i18n="@@cancel">Cancel</span>
          </button>
        </div>
      </div>
    </div>
    <div class="row mt-10">
      <!--    <div class="col-md-2 mb-10">-->
      <!--    <file-upload class="file-uploader" [multiple]="multiple"></file-upload>-->
      <!--  </div>-->
      <form ngForm [formGroup]="formGroup" autocomplete="off">
        <div class="row col-md-8">
          <div class="col-sm-12 mb-10">
            <div class="form-group">
              <mat-form-field>
                <mat-label i18n="@@department">
                  Department
                </mat-label>
                <input matInput formControlName="department" sizeInput="sm">
                <mat-error *ngIf="formGroup.get('department')?.invalid && formGroup.get('department')?.touched">
                  <span *ngIf="formGroup.get('department')?.hasError('required')">
                    Department is required
                  </span>
                </mat-error>
              </mat-form-field>
            </div>
          </div>
          <div class="col-sm-12 mb-10">
            <div class="form-group">
              <mat-form-field>
                <mat-label i18n="@@fullName">
                  Full name
                </mat-label>
                <input matInput formControlName="fullName" sizeInput="sm">
                <mat-error *ngIf="formGroup.get('fullName')?.invalid && formGroup.get('fullName')?.touched">
                  <span *ngIf="formGroup.get('fullName')?.hasError('required')">
                    FullName is required
                  </span>
                </mat-error>
              </mat-form-field>
            </div>
          </div>
          <div class="col-sm-12 mb-10">
            <div class="form-group">
              <mat-form-field>
                <mat-label i18n="@@gender">
                  Gender
                </mat-label>
                <mat-select formControlName="gender">
                  <mat-option [value]="0" i18n="@@female">
                    Female
                  </mat-option>
                  <mat-option [value]="1" i18n="@@male">
                    Male
                  </mat-option>
                </mat-select>
                <mat-error *ngIf="formGroup.get('gender')?.invalid && formGroup.get('gender')?.touched">
                  <span *ngIf="formGroup.get('gender')?.hasError('required')">
                    Gender is required
                  </span>
                </mat-error>
              </mat-form-field>
            </div>
          </div>
          <div class="col-sm-12 mb-10">
            <div class="form-group">
              <mat-form-field>
                <mat-label i18n="@@email">
                  Email
                </mat-label>
                <input matInput formControlName="email" [disabled]="true">
              </mat-form-field>
            </div>
          </div>
          <div class="col-sm-12 mb-10">
            <div class="form-group">
              <mat-form-field>
                <mat-label>
                  Enter phone number
                </mat-label>
                <input matInput formControlName="phone">
              </mat-form-field>
            </div>
          </div>
        </div>
        <!--      <div class="btn-box text-center mt-10">-->
        <!--        <button type="button" mat-button color="warn">-->
        <!--          <i class="material-symbols-outlined">-->
        <!--            close-->
        <!--          </i>-->
        <!--          <span i18n="@@cancel">Cancel</span>-->
        <!--        </button>-->
        <!--        <button mat-button color="primary" type="submit">-->
        <!--          <i class="material-symbols-outlined">-->
        <!--            check_circle-->
        <!--          </i>-->
        <!--          <span i18n="@@confirm">Confirm</span>-->
        <!--        </button>-->
        <!--      </div>-->
      </form>

    </div>
  </div>
</mat-card>
