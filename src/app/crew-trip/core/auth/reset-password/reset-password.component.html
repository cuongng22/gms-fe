<div
  class="forgot-password-area"
  [class.dark-theme]="themeService.isDark()"
>
  <div
    class="trezo-form ml-auto mr-auto"
    [class.component-dark-theme]="themeService.isDark()"
    [class.component-rtl-enabled]="themeService.isRTLEnabled()"
  >
    <div class="row align-items-center">
      <div class="col-lg-6 col-md-12 order-2 order-lg-1">
        <div class="form-image">
          <img src="images/background.jpg" alt="sign-in-image">
        </div>
      </div>
      <div class="col-lg-6 col-md-12 order-1 order-lg-2">
        <div class="form-content">
          <div class="logo">
            <img src="images/logo_vna4.png" alt="logo">
            <!--            <img src="images/white-logo-big.svg" class="d-none" alt="logo">-->
          </div>
          <div class="title">
            <h1 class="fw-semibold" i18n>
              Reset password.
            </h1>
          </div>
          <form ngForm  [formGroup]="formGroup" (ngSubmit)="resetPassword()">
            <div class="form-group">
              <label class="main-label d-block fw-medium text-black" i18n>
                New password
              </label>
              <mat-form-field>
                <input matInput [type]="hide ? 'password' : 'text'" formControlName="newPassword" required />
                <mat-error *ngIf="formGroup.get('newPassword')?.invalid && formGroup.get('newPassword')?.touched">
                                <span *ngIf="formGroup.get('newPassword')?.hasError('required')">
                                Password is required
                                </span>
                  <span *ngIf="formGroup.get('newPassword')?.hasError('minlength')">Password must be at least 8 characters</span>
                  <span *ngIf="formGroup.get('newPassword')?.hasError('incorrect')">
                                   {{ errorMessage }}
                                </span>
                </mat-error>
                <button mat-icon-button matSuffix (click)="hide = !hide" [attr.aria-label]="'Hide password'" [attr.aria-pressed]="hide">
                                    <span class="material-symbols-outlined">
                                        {{hide ? 'visibility_off' : 'visibility'}}
                                    </span>
                </button>
              </mat-form-field>
              <label class="main-label d-block fw-medium text-black mt-10" i18n>
                Confirm password
              </label>
              <mat-form-field>
                <input matInput [type]="hide ? 'password' : 'text'" formControlName="confirmPassword" required />
                <mat-error *ngIf="formGroup.get('confirmPassword')?.invalid && formGroup.get('confirmPassword')?.touched">
                                <span *ngIf="formGroup.get('confirmPassword')?.hasError('required')">
                                Confirm password is required
                                </span>
                  <span *ngIf="formGroup.get('confirmPassword')?.hasError('incorrect')">
                                   {{ errorMessage }}
                                </span>

                </mat-error>
                <mat-error *ngIf="formGroup.get('confirmPassword')?.hasError('mismatch') && formGroup.get('confirmPassword')?.touched">
                  Passwords do not match
                </mat-error>
                <button mat-icon-button matSuffix (click)="hide = !hide" [attr.aria-label]="'Hide password'" [attr.aria-pressed]="hide">
                                    <span class="material-symbols-outlined">
                                        {{hide ? 'visibility_off' : 'visibility'}}
                                    </span>
                </button>
              </mat-form-field>

              <ngx-spinner bdColor="rgba(0, 0, 0, 0.1)" size="medium" color="#2a6886" type="ball-climbing-dot"
                           [fullScreen]="false"></ngx-spinner>
            </div>
            <p *ngIf="successMessage" class="success-message">
              {{ successMessage }}
            </p>
            <button type="submit" mat-button i18n  [disabled]="formGroup.invalid">
              <i class="material-symbols-outlined">
                autorenew
              </i>
              Reset password
            </button>
            <p class="info">
              Back to <a routerLink="/auth/login" class="fw-semibold text-primary"  i18n>Sign In</a>
            </p>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
