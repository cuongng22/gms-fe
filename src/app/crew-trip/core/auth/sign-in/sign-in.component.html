<div
    class="sign-in-area"
    [class.dark-theme]="themeService.isDark()"
>
    <div
        class="trezo-form ml-auto mr-auto"
        [class.component-dark-theme]="themeService.isDark()"
        [class.component-rtl-enabled]="themeService.isRTLEnabled()"
    >
      <div class="login-container">
        <mat-card class="login-card">
          <img class="logo" src="images/logo_vna7.png" alt="Vietnam Airlines Logo" />
          <h2 class="title">VNA CREW TRIP</h2>
          <div class="form-login">
          <form ngForm  [formGroup]="formGroup" (ngSubmit)="login()">
            <mat-form-field appearance="outline" class="full-width">
              <mat-label>{{ 'EMAIL' | translate }}</mat-label>
              <input matInput type="email"  formControlName="email"  required />
              <mat-error *ngIf="formGroup.get('email')?.hasError('required') && formGroup.get('email')?.touched">
                Email is required.
              </mat-error>
              <mat-error *ngIf="formGroup.get('email')?.hasError('email') && formGroup.get('email')?.touched">
                Vui lòng nhập email hợp lệ.
              </mat-error>
<!--              <mat-icon matSuffix>account_circle</mat-icon>-->
            </mat-form-field>

            <mat-form-field appearance="outline" class="full-width">
              <mat-label>{{ 'PASSWORD' | translate }}</mat-label>
              <input matInput type="password" formControlName="password" required />
              <mat-error *ngIf="formGroup.get('password')?.hasError('required') && formGroup.get('password')?.touched">
                Password is required
              </mat-error>
<!--              <mat-icon matSuffix>lock</mat-icon>-->
            </mat-form-field>

            <mat-checkbox>{{ 'REMEMBER_ME' | translate }}</mat-checkbox>

            <div class="login-actions">
              <button mat-raised-button type="submit" [disabled]="formGroup.invalid"  class="login-btn">
                {{ 'LOGIN' | translate }}
              </button>
              <a href="#" class="sso-login">Login with SSO</a>
            </div>
            <!-- Vùng chứa liên kết "Quên mật khẩu?" dưới cùng -->
          </form>
          </div>
          <div class="forgot-password-container">
            <a href="#" class="forgot-password">{{ 'FORGOT_PASSWORD' | translate }}</a>
          </div>
        </mat-card>
      </div>
    </div>
</div>
