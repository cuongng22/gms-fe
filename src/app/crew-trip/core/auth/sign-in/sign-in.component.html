<div
  class="sign-in-area"
  [class.dark-theme]="themeService.isDark()"
>
  <div
    class="trezo-form ml-auto mr-auto"
    [class.component-dark-theme]="themeService.isDark()"
    [class.component-rtl-enabled]="themeService.isRTLEnabled()"
  >
    <div class="row align-items-center">
      <div class="col-lg-6 col-md-12 order-2 order-lg-1">
        <div class="form-image sign-in-banner">
          <img class="banner1" src="images/bau-troi-xanh.jpg" alt="sign-in-image">
          <img class="banner2" src="images/maybay.png" alt="sign-in-image">
        </div>
      </div>
      <div class="col-lg-6 col-md-12 order-1 order-lg-2" style="z-index: 10;">
        <div class="form-content">
          <div class="logo">
            <img src="images/logo_vna4.png" alt="logo">
          </div>
          <div class="title">
            <h1 class="fw-semibold">
              VNA CREW TRIP
            </h1>
          </div>
          <form ngForm [formGroup]="formGroup" (ngSubmit)="login()">
            <div class="form-group">
              <mat-form-field>
                <mat-label i18n="@@email">Email</mat-label>
                <input matInput type="email" trim="blur" formControlName="email" required/>
                <mat-error *ngIf="formGroup.get('email')?.invalid && formGroup.get('email')?.touched">
                  <span *ngIf="formGroup.get('email')?.hasError('required')">
                      Please enter your email
                  </span>
                  <span *ngIf="formGroup.get('email')?.hasError('email')" i18n>
                   Invalid email
                   </span>
                </mat-error>
                <mat-error *ngIf="formGroup.get('email')?.hasError('incorrect')">
                  {{ errorMessage }}
                </mat-error>
              </mat-form-field>
            </div>
            <div class="form-group">
              <mat-form-field>
                <mat-label i18n="@@password">Password</mat-label>
                <input matInput trim="blur" [type]="hide ? 'password' : 'text'" formControlName="password" required/>
                <mat-error *ngIf="formGroup.get('password')?.invalid && formGroup.get('password')?.touched">
                  <span *ngIf="formGroup.get('password')?.hasError('required')">
                      Please enter your password
                  </span>
                </mat-error>
                <mat-error *ngIf="formGroup.get('password')?.hasError('incorrect')">
                  {{ errorMessage }}
                </mat-error>
                <button mat-icon-button matSuffix type="button" (click)="hide = !hide"
                        [attr.aria-label]="'Hide password'" [attr.aria-pressed]="hide">
                                    <span class="material-symbols-outlined">
                                        {{ hide ? 'visibility_off' : 'visibility' }}
                                    </span>
                </button>
              </mat-form-field>
              <mat-checkbox i18n>Remember me</mat-checkbox>
              <ngx-spinner bdColor="rgba(0, 0, 0, 0.1)" size="medium" color="#2a6886" type="ball-climbing-dot"
                           [fullScreen]="false"></ngx-spinner>
            </div>
            <div class="forgot-password">
              <a routerLink="/auth/forgot-password" class="text-primary fw-semibold" i18n>
                Forgot Password?
              </a>
            </div>
            <button type="submit" mat-button i18n class="button-login custom-button">
              <i class="material-symbols-outlined">
                login
              </i>
              Login
            </button>
          </form>
          <div class="with-socials d-flex align-items-center justify-content-between mt-10">
            <div>
              <button type="button" mat-button>
                <img src="images/icons/google.svg" alt="google">
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
