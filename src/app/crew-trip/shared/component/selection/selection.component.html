<div [sizeInput]="sizeInput">
  <mat-form-field>
    <mat-label>
      {{ label }}
    </mat-label>
    <mat-select [formControl]="formControl" [required]="required"
                [placeholder]="options.length ? options[0].display : 'Select an option'">
      <mat-option *ngFor="let item of options" [value]="item.value">
        {{ item.display }}
      </mat-option>
    </mat-select>
    <mat-error *ngIf="ngControl?.control?.hasError('required')">
      {{ label }} is required.
    </mat-error>
    <ng-content select="[mess-error]"></ng-content>
  </mat-form-field>
</div>
