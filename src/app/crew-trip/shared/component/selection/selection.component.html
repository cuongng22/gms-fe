<div [sizeInput]="size">
  <mat-form-field>
    <mat-label>
      {{ label }}@if(requiredControl){<span class="text-red"> *</span>}
    </mat-label>
    <mat-select [formControl]="formControl" [required]="required">
      @if(isFirstBlank){
      <mat-option [value]="null">{{labelFirst}}</mat-option>
      }
      <mat-option *ngFor="let item of options" [value]="attrValue?item[attrValue]:item">
        {{ attrDisplay?item[attrDisplay]:item }}
      </mat-option>
    </mat-select>
    <mat-error *ngIf="ngControl?.control?.hasError('required')">
      {{ label }} is required.
    </mat-error>
    <ng-content select="[mess-error]"></ng-content>
  </mat-form-field>
</div>
