<div [sizeInput]="size()">
    <mat-form-field>
        @if(!!label()){
        <mat-label>{{label()}}</mat-label>
        }
        <input [required]="required()" matInput [matDatepicker]="datePicker" [(ngModel)]='datePickerValue'>
        <mat-datepicker-toggle matIconSuffix [for]="datePicker"></mat-datepicker-toggle>
        <mat-datepicker #datePicker startView="year" (monthSelected)="setMonthAndYear($event, datePicker)"
            panelClass="example-month-picker">
        </mat-datepicker>
        @if(required()){
        <mat-error>
            {{messageRequired()}}
        </mat-error>
        }
    </mat-form-field>
</div>
