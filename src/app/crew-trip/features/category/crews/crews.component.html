<!-- Breadcrumb -->
<div class="breadcrumb-card mb-10 d-md-flex align-items-center justify-content-between">
    <h5 class="mb-0" i18n="@@crewList">
        Crew List
    </h5>
    <ol class="breadcrumb list-unstyled mt-0 mb-0 p-0">
      <li class="breadcrumb-item d-inline-block position-relative" i18n="@@category">
        Category
      </li>
      <li class="breadcrumb-item d-inline-block position-relative" i18n="@@crewList">
        Crew List
      </li>
    </ol>
  </div>
  
  
  <!--Search-->
  <mat-card class="mb-10 pt-15 pl-15 pr-15 pb-0 border-radius d-block bg-white border-0 shadow-none">
    <mat-card-content>
      <form [formGroup]="formGroupSearch" (ngSubmit)="search()" autocomplete="off">
        <div class="row">
          <div class="col-xs-12 col-sm-12 col-md-12 col-lg-12">
            <div class="row mb-3">
              <div class="col-md-6" sizeInput="md">
                <mat-form-field>
                  <mat-label i18n="@@keywords">Keywords</mat-label>
                  <input matInput formControlName="s">
                </mat-form-field>
              </div>

              <div class="col-md-6">
                <div class="col-1 d-flex flex-row">
                    <mat-card-header class="mb-0 search">
                      <mat-card-title>
                        <button class="search-btn" type="submit" mat-button>
                          <i class="material-symbols-outlined">
                            search
                          </i>
                          <span i18n="@@search">Search</span>
                        </button>
                      </mat-card-title>
                    </mat-card-header>
                  </div>
              </div>
            </div>
          </div>
        </div>
      </form>
    </mat-card-content>
  </mat-card>

<!-- Start Danh sách Tổ bay -->

<mat-card class="mb-10 p-15 border-radius d-block bg-white border-0 shadow-none">
    <mat-card-header class="mb-10">
      <mat-card-title>
        <h5 i18n="@@crewList">Crew List</h5>
      </mat-card-title>
      <mat-card-subtitle>
        <button class="add-btn" type="button" mat-button (click)="exportFile(null,'Crew List.xlsx')">
          <i class="material-symbols-outlined">
            download
          </i>
          <span i18n="@@export">Export</span>
        </button>
      </mat-card-subtitle>
    </mat-card-header>
    <mat-card-content>
      <div class="table-responsive">
        <table mat-table [dataSource]="dataSource" multiTemplateDataRows="true">
          <ng-container matColumnDef="stt">
            <th mat-header-cell *matHeaderCellDef mat-sort-header class="font-weight-bold">#</th>
            <td mat-cell *matCellDef="let element; let i = dataIndex">{{ i + 1 }}</td>
          </ng-container>
          @for (innerColumn of _displayedColumns; track innerColumn.value) {
            <ng-container matColumnDef="{{innerColumn.value}}">
              <th mat-sort-header mat-header-cell *matHeaderCellDef class="font-weight-bold">{{ innerColumn.label}}</th>
              <td mat-cell *matCellDef="let element">
                {{element[innerColumn.value]|dataTransformPipe:[innerColumn.type,innerColumn.format] }}
              </td>
            </ng-container>
            }
          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  
        </table>
      </div>
      <mat-paginator (page)="onPageChange($event)" [length]="totalElement" [pageSize]="pageSize"
        [showFirstLastButtons]="showFirstLastButtons" [pageSizeOptions]="pageSizeOptions" [pageIndex]="pageIndex"
        aria-label="Select page" i18n-aria-label="@@selectPage">
      </mat-paginator>
    </mat-card-content>
  </mat-card>
  
  <!-- End Danh sách Tổ bay -->
