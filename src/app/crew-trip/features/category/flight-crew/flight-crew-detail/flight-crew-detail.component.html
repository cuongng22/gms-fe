<mat-card class="border-radius d-block bg-white border-0 shadow-none">
  <mat-card-header class="p-15">
    <mat-card-title>
      <h5 class="mb-0" i18n="@@crewInformation">
        {{(this.data.id?'Edit':'Add new')}}
      </h5>
    </mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <form [formGroup]="formGroupDetail" (ngSubmit)="save()" autocomplete="off">
      <div class="row">
        <div class="col-sm-12 col-md-12">
          <div class="form-group mb-20" sizeInput="md">

          </div>
        </div>

        <div class="col-sm-12 col-md-12">
          <div class="form-group mb-20" sizeInput="md">

          </div>
        </div>

        <div class="col-sm-12 col-md-12">
          <div class="form-group mb-20" sizeInput="md">

          </div>
        </div>

        <div class="col-sm-12 col-md-12">
          <div class="form-group mb-20" sizeInput="md">



          </div>
        </div>

        <div class="col-sm-12 col-md-12">
          <div class="form-group mb-20" sizeInput="md">
          </div>
        </div>

        <div class="col-sm-12 col-md-12">
          <div class="form-group mb-20" sizeInput="md">

          </div>
        </div>

      </div>

      <div class="btn-box d-flex justify-content-end">
        <button type="button" mat-button (click)="close()" class="close-btn  min-with-100 mlr-5">
          <i class="material-symbols-outlined">
            close
          </i>
          <span i18n="@@cancel">Close</span>
        </button>
        <button mat-button color="primary" type="submit" class="add-btn min-with-100 mlr-5">
          <i class="material-symbols-outlined">
            save
          </i>
          <span i18n="@@save">Save</span>
        </button>

      </div>
    </form>

  </mat-card-content>
</mat-card>
