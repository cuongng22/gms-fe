<!-- Breadcrumb -->
<div class="breadcrumb-card mb-10 d-md-flex align-items-center justify-content-between">
  <h5 class="mb-0" i18n="@@flightCrew">
    Flight crew
  </h5>
  <ol class="breadcrumb list-unstyled mt-0 mb-0 p-0">
    <li class="breadcrumb-item d-inline-block position-relative" i18n="@@category">
      Category
    </li>
    <li class="breadcrumb-item d-inline-block position-relative">
      Flight crew
    </li>
  </ol>
</div>
<!--Search-->
<mat-card class="mb-10 pt-15 pl-15 pr-15 pb-0 border-radius d-block bg-white border-0 shadow-none">
  <mat-card-content>
    <mat-tab-group mat-stretch-tabs="false" mat-align-tabs="start">
      <mat-tab label="Flight crew" i18n="@@flightCrew">
        <mat-card class="mb-15 border-radius d-block bg-white border-0 shadow-none">
          <mat-card-content>
            <form [formGroup]="formGroupSearch" autocomplete="off">
              <div class="row">
                <div class="col-sm-3" sizeInput='sm'>
                  <mat-form-field>
                    <mat-label>Keyword</mat-label>
                    <input formControlName="s" matInput>
                    <i class="material-symbols-outlined mr-15" matSuffix>
                      search
                    </i>
                  </mat-form-field>
                </div>
                <div class="col-sm-3" sizeInput='sm'>
                  <mat-form-field>
                    <mat-label>Region</mat-label>
                    <mat-select formControlName="area">
                      <mat-option [value]="null">-- All region --</mat-option>
                      <mat-option value="Asia">Asia</mat-option>
                      <mat-option value="Europe">Europe</mat-option>
                      <mat-option value="Africa">Africa</mat-option>
                      <mat-option value="America">America</mat-option>
                      <mat-option value="Australia">Australia</mat-option>
                      <mat-option value="Antarctica">Antarctica</mat-option>
                    </mat-select>
                  </mat-form-field>
                </div>
                <div class="col-sm-3" sizeInput='sm'>
                  <mat-form-field>
                    <mat-label>Status</mat-label>
                    <mat-select formControlName="active">
                      <mat-option [value]="null">-- All status --</mat-option>
                      <mat-option value="1">Active</mat-option>
                      <mat-option value="0">Inactive</mat-option>
                    </mat-select>
                  </mat-form-field>
                </div>
                <div class="col-sm-3">
                  <mat-card-header class="mb-0">
                    <mat-card-title>
                      <button (click)="search()" class="search-btn" mat-button>
                        <i class="material-symbols-outlined">
                          search
                        </i>
                        Search
                      </button>
                    </mat-card-title>
                  </mat-card-header>
                </div>
              </div>
            </form>
          </mat-card-content>
        </mat-card>
        <!-- Content -->

      </mat-tab>
      <mat-tab label="Other Crew Crewd" i18n="@@otherCrew">
        <app-other-crew></app-other-crew>
      </mat-tab>
      <mat-tab label="Overnight rate configuration" i18n="@@overnightRaeConfiguration">
        <app-config-overnight-rate></app-config-overnight-rate>
      </mat-tab>
    </mat-tab-group>
  </mat-card-content>
</mat-card>
