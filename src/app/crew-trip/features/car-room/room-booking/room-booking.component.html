<!-- Breadcrumb -->
<div class="breadcrumb-card mb-10 d-md-flex align-items-center justify-content-between">
	<h5 class="mb-0" i18n="@@crewList">
		Hotel booking
	</h5>
	<ol class="breadcrumb list-unstyled mt-0 mb-0 p-0">
		<li class="breadcrumb-item d-inline-block position-relative" i18n="@@system">
			Accommodation Service
		</li>
		<li class="breadcrumb-item d-inline-block position-relative" i18n="@@config">
			Hotel Room
		</li>
		<li class="breadcrumb-item d-inline-block position-relative" i18n="@@groupMail">
			Hotel booking
		</li>
	</ol>
</div>

<mat-card class="mb-10 mt-10 pt-15 pl-15 pr-15 pb-15 border-radius d-block bg-white border-0 shadow-none">
	<mat-card-content>
		<form [formGroup]="formGroupSearch" (ngSubmit)="search()" class="form-inline">
			<div class="row">
				<div class="col-md-2 col-xs-2 col-sm-2 col-lg-2" sizeInput="sm">
					<app-selection [options]="optionsFlightScheduleType" label="Flight Schedule Type"
												 formControlName="scheduleType">
					</app-selection>
				</div>
				<div class="col-md-2 col-xs-2 col-sm-2 col-lg-2">
					<app-selection-suggest i18n-label="@@marketCode" label="Airport code" [options]="markets"
																 formControlName="marketCode" size="sm" />
				</div>
				<div class="col-md-2 col-xs-2 col-sm-2 col-lg-2" sizeInput="sm">
					<app-selection [options]="optionsServiceApplied" label="FC/CC" formControlName="type">
					</app-selection>
				</div>
				<div class="col-md-2 col-xs-2 col-sm-2 col-lg-2" sizeInput="sm">
					<mat-form-field class="mb-1">
						<mat-date-range-input [rangePicker]="contractRangePicker">
							<input trim="blur" matStartDate i18n-placeholder="@@startDate" placeholder="dd/mm/yyyy"
										 formControlName="startDate">
							<input trim="blur" matEndDate i18n-placeholder="@@endDate" placeholder="dd/mm/yyyy"
										 formControlName="endDate">
						</mat-date-range-input>
						<mat-label i18n="@@time">Time</mat-label>
						<mat-datepicker-toggle matIconSuffix [for]="contractRangePicker"></mat-datepicker-toggle>
						<mat-date-range-picker #contractRangePicker>
							<mat-date-range-picker-actions>
								<button sizeButton="sm" mat-button matDateRangePickerCancel i18n="@@cancel">Cancel
								</button>
								<button sizeButton="sm" mat-raised-button color="primary" matDateRangePickerApply i18n="@@apply">Apply
								</button>
							</mat-date-range-picker-actions>
						</mat-date-range-picker>
						<mat-error *ngxControlError="formGroupSearch.controls['startDate']; track: 'matDatepickerParse'"
											 i18n="@@timeInvalidFormat">
							Time invalid format
						</mat-error>
						<mat-error *ngxControlError="formGroupSearch.controls['endDate']; track: 'matDatepickerParse'"
											 i18n="@@timeInvalidFormat">
							Time invalid format
						</mat-error>
					</mat-form-field>
				</div>
				<!--        <div class="col-md-2 col-xs-2 col-sm-2 col-lg-2" sizeInput="sm">-->
				<!--          <app-selection [options]="listYear" label="Year" formControlName="year" size="sm" attrDisplay="" attrValue="">-->
				<!--          </app-selection>-->
				<!--        </div>-->
				<div class="col-md-2 col-xs-2 col-sm-2 col-lg-2" sizeInput="sm">
					<mat-card-title>
						<button class="search-btn" (click)="search()" mat-button>
							<i class="material-symbols-outlined">
								search
							</i>
							<span i18n="@@search">Search</span>
						</button>
					</mat-card-title>
				</div>
			</div>
		</form>
	</mat-card-content>
</mat-card>
<mat-card class="mb-10 p-15 border-radius d-block bg-white border-0 shadow-none">
	<mat-card-header class="mb-10">
		<mat-card-title class="sub-title">
			<!--			<mat-checkbox class="mr-10" i18n="@@checkin" (change)="checkinClick($event)"  >-->
			<!--				Checkin-->
			<!--			</mat-checkbox>-->
			<!--			<mat-checkbox class="mr-10" i18n="@@checkout" (change)="checkoutClick($event)" >-->
			<!--				Checkout-->
			<!--			</mat-checkbox>-->
		</mat-card-title>
		<mat-card-subtitle>
			<button class="add-btn mr-10" type="button" (click)="exportFileOptions(null,'room-booking.xlsx')" mat-button>
				<i class="material-symbols-outlined">
					download
				</i>
				<span i18n="@@export">Export</span>
			</button>
		</mat-card-subtitle>
	</mat-card-header>
	<mat-card-content>
		<div class="table-responsive scroll-container">
			<table mat-table [dataSource]="dataSource" multiTemplateDataRows="true"
						 class="mat-elevation-z8 table-light table-container">
				<ng-container *ngFor="let column of displayedColumns; index as i" [matColumnDef]="column" [sticky]="i <= 3">
					<th mat-header-cell *matHeaderCellDef
							[ngClass]="{
            'text-center': i >= 3 || i == 0
            }">
						{{ column }}
					</th>
					<td mat-cell *matCellDef="let element"
							class="multiline"
							[ngClass]="{
            'text-center': i >= 3
          }">
						<div [innerHTML]="formatNewLine(element[column])"></div>
					</td>
				</ng-container>
				<tr mat-header-row *matHeaderRowDef="displayedColumns" class="sticky-header-row"></tr>
				<tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
				<tr class="mat-row" *matNoDataRow>
					<td class="mat-cell text-center" [attr.colspan]="displayedColumns.length">No data!</td>
				</tr>
			</table>
		</div>
	</mat-card-content>
</mat-card>
