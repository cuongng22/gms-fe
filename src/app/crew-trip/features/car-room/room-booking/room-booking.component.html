<!-- Breadcrumb -->
<div class="breadcrumb-card mb-10 d-md-flex align-items-center justify-content-between">
  <h5 class="mb-0" i18n="@@crewList">
    Room booking
  </h5>
  <ol class="breadcrumb list-unstyled mt-0 mb-0 p-0">
    <li class="breadcrumb-item d-inline-block position-relative" i18n="@@system">
      Accommodation Service
    </li>
    <li class="breadcrumb-item d-inline-block position-relative" i18n="@@config">
      Hotel Room
    </li>
    <li class="breadcrumb-item d-inline-block position-relative" i18n="@@groupMail">
      Room Booking
    </li>
  </ol>
</div>

<mat-card class="mb-10 mt-10 pt-15 pl-15 pr-15 pb-15 border-radius d-block bg-white border-0 shadow-none">
  <mat-card-content>
    <form [formGroup]="formGroupSearch" (ngSubmit)="search()" class="form-inline">
      <div class="row">
        <div class="col-md-2 col-xs-2 col-sm-2 col-lg-2" sizeInput="sm">
          <app-selection [required]="true"
            [options]="optionsFlightScheduleType"
            label="Flight Schedule Type"
            formControlName="scheduleType"
          >
          </app-selection>
        </div>
        <div class="col-md-2 col-xs-2 col-sm-2 col-lg-2" sizeInput="sm">
          <app-selection-suggest required
            i18n-label="@@airportCodes"
            label="Market code"
            [options]="markets"
            formControlName="marketCode"
            size="sm"
          ></app-selection-suggest>
        </div>
        <div class="col-md-2 col-xs-2 col-sm-2 col-lg-2" sizeInput="sm">
          <app-selection [options]="optionsServiceApplied" [required]="true" label="FC/CC" formControlName="type">
          </app-selection>
        </div>
        <div class="col-md-2 col-xs-2 col-sm-2 col-lg-2" sizeInput="sm">
          <app-selection
            [options]="monthSelection"
            label="Month"
            [required]="true"
            formControlName="month"
            size="sm"
            attrDisplay=""
            attrValue=""
          ></app-selection>
        </div>
        <div class="col-md-2 col-xs-2 col-sm-2 col-lg-2" sizeInput="sm">
          <app-selection
            [options]="listYear"
            label="Year"
            formControlName="year"
            size="sm" [required]="true"
            attrDisplay=""
            attrValue=""
          >
          </app-selection>
        </div>
        <div class="col-md-2 col-xs-2 col-sm-2 col-lg-2" sizeInput="sm">
          <mat-card-title>
            <button class="search-btn" (click)="search()" mat-button>
              <i class="material-symbols-outlined">
                search
              </i>
              <span i18n="@@search">Search</span>
            </button>
          </mat-card-title>
        </div>
      </div>
    </form>
  </mat-card-content>
</mat-card>
<mat-card class="mb-10 p-15 border-radius d-block bg-white border-0 shadow-none">
  <mat-card-header class="mb-10">
    <mat-card-title class="sub-title">
    </mat-card-title>
    <mat-card-subtitle>
      <button class="add-btn mr-10" type="button" mat-button>
        <i class="material-symbols-outlined">
          download
        </i>
        <span i18n="@@export">Export</span>
      </button>
    </mat-card-subtitle>
  </mat-card-header>
  <mat-card-content>
    <div class="table-responsive">
      <table mat-table [dataSource]="dataSource" multiTemplateDataRows="true" class="table-light">
        <ng-container *ngFor="let column of displayedColumns" [matColumnDef]="column">
          <th mat-header-cell *matHeaderCellDef>{{ column }}</th>
          <td mat-cell *matCellDef="let element">{{ element[column] }}</td>
        </ng-container>
        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        <tr *matNoDataRow class="mat-row">
          <td [attr.colspan]="displayedColumns.length" class="mat-cell text-center"><span i18n>No data!</span>
        </tr>
      </table>
    </div>
  </mat-card-content>
</mat-card>
