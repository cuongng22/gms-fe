<!-- Breadcrumb -->
<div class="breadcrumb-card mb-10 d-md-flex align-items-center justify-content-between">
    <div class="d-flex align-items-center justify-content-between mt-2">
        <button type="button" class="btn btn-outline-secondary mr-20" i18n="@@back"
            [routerLink]="['/plan/est-plan/est-cost',estimatedCostId(),'summary']">
            <i class="material-symbols-outlined">
                undo
            </i>
            Back
        </button>
        <h5 class="mb-0" i18n="@@planForAirport">
            Estimated Cost of Airport {{airportCode()}}
        </h5>
    </div>

    <ol class="breadcrumb list-unstyled mt-0 mb-0 p-0">
        <li class="breadcrumb-item d-inline-block position-relative" i18n="@@plan">
            Plan
        </li>
        <li class="breadcrumb-item d-inline-block position-relative" i18n="@@estimatedPlan">
            Estimated/Plan
        </li>
        <li class="breadcrumb-item d-inline-block position-relative" i18n="@@budgetProcurementPlan">
            Budget & Procurement plan
        </li>
        <li class="breadcrumb-item d-inline-block position-relative" i18n="@@summaryPlan">
            Estimated cost summary
        </li>
        <li class="breadcrumb-item d-inline-block position-relative" i18n="@@planDetails">
            Estimated cost Details
        </li>
    </ol>
</div>

<mat-card class="mb-10 p-15 border-radius d-block bg-white border-0 shadow-none">
    <mat-card-header class="mb-10">
        <mat-card-title>
            <h5 class="mb-0">I. <span i18n="@@generalInformation">General Information</span></h5>
        </mat-card-title>
        <mat-card-subtitle>
            <div (scroll)="onScroll()" [ngClass]="isSticky ? 'fixed' : 'notfixed'">
                <button type="button" mat-button class="close-btn  min-with-100 mlr-5"
                    [routerLink]="['/plan/est-plan/est-cost',estimatedCostId(),'summary']">
                    <i class="material-symbols-outlined">
                        close
                    </i>
                    <span i18n="@@close">Close</span>
                </button>
                <button class="success-btn" type="button" mat-button [disabled]="checkStatusCompelted()"
                    (click)="completed()">
                    <i class="material-symbols-outlined">
                        check_circle
                    </i>
                    <span i18n="@@completed">Completed</span>
                </button>
                <button mat-button color="primary" type="button" class="add-btn min-with-100 mlr-5" (click)="save()"
                    [disabled]="checkStatusCompelted()">
                    <i class="material-symbols-outlined">
                        save
                    </i>
                    <span i18n="@@save">Save</span>
                </button>
            </div>

        </mat-card-subtitle>
    </mat-card-header>
    <mat-card-content>
        <app-estimated-cost-general #estimatedCostGeneral [category]="CategoryEnum.INTERNATIONAL"
            [disabled]="checkStatusCompelted()"
            (formValueChanges)="formGeneralValueChanges($event)"></app-estimated-cost-general>
    </mat-card-content>
</mat-card>
