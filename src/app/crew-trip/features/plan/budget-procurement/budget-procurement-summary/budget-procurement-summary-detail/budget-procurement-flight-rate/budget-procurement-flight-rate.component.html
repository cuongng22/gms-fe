<div class="row">
    <div class="col-md-6">
        <div class="table-responsive">
            <table mat-table [dataSource]="dataSource" multiTemplateDataRows="true" class="table-light">
                <ng-container matColumnDef="year">
                    <th mat-sort-header mat-header-cell *matHeaderCellDef class="font-weight-bold text-center" i18n="@@year">
                        Year
                    </th>
                    <td mat-cell *matCellDef="let element">
                        @if(element.type === 'total') {
                        {{element.year}}
                        }@else {
                        Flight rate {{element.year}}/{{element.rateYear}}
                        }
                    </td>
                </ng-container>
                <ng-container matColumnDef="rateOrTotal">
                    <th mat-sort-header mat-header-cell *matHeaderCellDef class="font-weight-bold text-center" i18n="@@hotelName">
                        Total Number of Flights
                    </th>
                    <td mat-cell *matCellDef="let element; let i = dataIndex"
                        [style.padding]="element.editing?'0px !important':''" (click)="clickEdit(element)">
                        @if(!element.editing){
                        {{element.value}}
                        }@else {
                        <div sizeInput="xs">
                            <mat-form-field (clickOutside)="clickOutside(element)" class="edit-inline-table">
                                <input matInput [(ngModel)]="element.value" maxlength="100">
                            </mat-form-field>
                        </div>
                        }
                    </td>
                </ng-container>
                <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

            </table>
        </div>
    </div>
</div>
