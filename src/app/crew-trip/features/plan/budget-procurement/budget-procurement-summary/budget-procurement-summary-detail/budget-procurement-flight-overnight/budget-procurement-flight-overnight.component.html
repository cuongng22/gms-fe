<div class="row">
    <div class="col-md-6">
        <div class="table-responsive">
            <table mat-table [dataSource]="dataSource" multiTemplateDataRows="true" class="table-light">
                <ng-container matColumnDef="numberOfOvernight">
                    <th mat-sort-header mat-header-cell *matHeaderCellDef class="font-weight-bold text-center"
                        i18n="@@numberOfOvernightStays">
                        Number of Overnight Stays
                    </th>
                    <td mat-cell *matCellDef="let element">
                        {{element.numberOfOvernight}}
                    </td>
                </ng-container>
                <ng-container matColumnDef="flightRate">
                    <th mat-sort-header mat-header-cell *matHeaderCellDef class="font-weight-bold text-center" i18n="@@flightRate">
                        Flight Rate
                    </th>
                    <td sizeInput="xs" mat-cell *matCellDef="let element; let i = dataIndex"
                        [style.padding]="element.editing?'0px !important':''" (click)="clickEdit(element)">
                        @if(!element.editing){
                        {{element.flightRate}}
                        }@else {
                        <div sizeInput="xs">
                            <mat-form-field (clickOutside)="clickOutside(element)" class="edit-inline-table">
                                <input matInput [(ngModel)]="element.flightRate" maxlength="100">
                            </mat-form-field>
                        </div>
                        }
                    </td>
                </ng-container>
                <ng-container matColumnDef="action" stickyEnd>
                    <th mat-header-cell mat-sort-header mat-header-cell *matHeaderCellDef class="font-weight-bold text-center"
                        i18n="@@action">
                        Action
                    </th>
                    <td mat-cell *matCellDef="let element; let i = dataIndex">
                        <div class="action-buttons d-flex justify-content-end">
                            <button type="button" mat-button title="Delete" i18n-title="@@delete" class="text-danger">
                                <span class="material-symbols-outlined text-danger">
                                    delete
                                </span>
                            </button>
                        </div>
                    </td>
                </ng-container>
                <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

            </table>
        </div>
    </div>
</div>
