<div class="row">
    <div class="col-lg-6">
        <div class="table-responsive">
            <table mat-table [dataSource]="dataSource" multiTemplateDataRows="true" class="table-light">
                <ng-container matColumnDef="year">
                    <th mat-sort-header mat-header-cell *matHeaderCellDef class="font-weight-bold text-center"
                        i18n="@@year">
                        Year
                    </th>
                    <td mat-cell *matCellDef="let element">
                        @if(element.type === 'TOTAL') {
                        <span i18n="@@year">Year </span> {{element.year}}
                        }@else {
                        <span i18n="@@flightRate">Flight rate</span> ({{element.year}}/{{element.rateYear}})
                        }
                    </td>
                </ng-container>
                <ng-container matColumnDef="rateOrTotal">
                    <th mat-sort-header mat-header-cell *matHeaderCellDef class="font-weight-bold text-center"
                        i18n="@@hotelName">
                        Total Number of Flights
                    </th>
                    <td mat-cell *matCellDef="let element; let i = dataIndex">
                        {{element.value |number}}
                    </td>
                </ng-container>
                <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
                <tr class="mat-row" *matNoDataRow>
                    <td class="mat-cell text-center" colspan="2">No data!</td>
                </tr>
            </table>
        </div>
    </div>
</div>
