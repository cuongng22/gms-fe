<div class="row">
    <div class="col-lg-6">
        <div class="table-responsive">
            <table mat-table [dataSource]="dataSource" multiTemplateDataRows="true" class="table-light">
                <ng-container matColumnDef="period">
                    <th mat-sort-header mat-header-cell *matHeaderCellDef class="font-weight-bold text-center"
                        i18n="@@period">
                        Period
                    </th>
                    <td mat-cell *matCellDef="let element" [attr.rowspan]="periodRowspan"
                        [style.display]="!!element.period?'':'none'">
                        {{element.period}}
                    </td>
                </ng-container>
                <ng-container matColumnDef="aircraftType">
                    <th mat-sort-header mat-header-cell *matHeaderCellDef class="font-weight-bold text-center"
                        i18n="@@aircraftType">
                        Aircraft Type
                    </th>
                    <td mat-cell *matCellDef="let element">
                        {{element.aircraftType}}
                    </td>
                </ng-container>
                <ng-container matColumnDef="numberOfFlight">
                    <th mat-sort-header mat-header-cell *matHeaderCellDef class="font-weight-bold text-center"
                        i18n="@@numberOfFlights">
                        Number of Flights
                    </th>
                    <td mat-cell *matCellDef="let element; let i = dataIndex"
                        [style.padding]="element.editing?'0px !important':''" (click)="clickEdit(element)">

                        @if(!element.editing){
                        {{element.numberOfFlight}}
                        }@else {
                        <div sizeInput="xs">
                            <mat-form-field (clickOutside)="clickOutside(element)" class="edit-inline-table">
                                <input matInput [(ngModel)]="element.numberOfFlight" maxlength="100">
                            </mat-form-field>
                        </div>
                        }
                    </td>
                </ng-container>
                <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

            </table>
        </div>
    </div>
</div>
