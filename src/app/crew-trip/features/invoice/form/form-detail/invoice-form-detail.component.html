<div class="breadcrumb-card mb-10 d-md-flex align-items-center justify-content-between">
  <div class="d-md-flex align-items-center">
    <h5 class="mb-0 d-inline ml-10">
      <h5 class="mb-0 ml-10">
        <span i18n>Detailed Statement</span>
      </h5>
    </h5>

  </div>
  <ol class="breadcrumb list-unstyled mt-0 mb-0 p-0">
    <li class="breadcrumb-item d-inline-block position-relative">
      <a class="d-inline-block position-relative" routerLink="/">
        <i class="material-symbols-outlined">
          home
        </i>
        Dashboard
      </a>
    </li>
    <li class="breadcrumb-item d-inline-block position-relative" i18n>
      Detailed Statement
    </li>
    <li class="breadcrumb-item d-inline-block position-relative" i18n>
      Detail
    </li>
  </ol>
</div>
<div (scroll)="onScroll()" [ngClass]="isSticky ? 'fixed' : 'notfixed'" class="w-100 text-end mb-10">
  <button (click)="goBack()" class="step-2-menu-button btn-slot-3" extended i18n mat-fab>
    <i class="material-symbols-outlined">
      undo
    </i>
    Back
  </button>
</div>
