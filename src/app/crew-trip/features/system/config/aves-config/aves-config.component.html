<!-- Breadcrumb -->
<div class="breadcrumb-card mb-10 d-md-flex align-items-center justify-content-between">
	<h5 class="mb-0" i18n="@@hotel">
		Aves Configuration
	</h5>
	<ol class="breadcrumb list-unstyled mt-0 mb-0 p-0">
		<li class="breadcrumb-item d-inline-block position-relative" i18n="@@system">
			System
		</li>
		<li class="breadcrumb-item d-inline-block position-relative" i18n="@@config">
			Config
		</li>
		<li class="breadcrumb-item d-inline-block position-relative" i18n="@@emailToSupplier">
			Aves Configuration
		</li>
	</ol>
</div>
<mat-card class="mb-10 p-15 border-radius d-block bg-white border-0 shadow-none">
	<mat-card-header class="mb-10">
	</mat-card-header>
	<mat-card-content>
		<div class="table-responsive">
			<table mat-table [dataSource]="dataSource" multiTemplateDataRows="true" class="table-light">
				<ng-container matColumnDef="stt">
					<th mat-header-cell *matHeaderCellDef class="font-weight-bold text-center ">#</th>
					<td mat-cell *matCellDef="let element; let i = dataIndex" class="text-center">
						{{ (pageIndex * pageSize) + i + 1 }}
					</td>
				</ng-container>
				<ng-container matColumnDef="month">
					<th mat-header-cell *matHeaderCellDef class="font-weight-bold text-center">Month</th>
					<td mat-cell *matCellDef="let element" class="text-center">
						{{ element.month }}
					</td>
				</ng-container>
				<ng-container matColumnDef="date">
					<th mat-header-cell *matHeaderCellDef class="font-weight-bold text-center">Date</th>
					<td mat-cell *matCellDef="let element" class="text-center">
						{{ element.date }}
					</td>
				</ng-container>
				<ng-container matColumnDef="action" stickyEnd class="font-weight-bold text-center" i18n="@@actions">
					<th mat-header-cell *matHeaderCellDef class="font-weight-bold text-center">Action</th>
					<td mat-cell *matCellDef="let element">
						<div class="action-buttons d-flex align-items-center justify-content-end">
							<button type="button" mat-button (click)="editItem(element)">
								<i class="material-symbols-outlined text-warning" title="Edit transportation"
									 i18n-title="@@editCarRental">
									edit
								</i>
							</button>
						</div>
					</td>
				</ng-container>
				<tr mat-header-row *matHeaderRowDef="['stt', 'month', 'date', 'action']"></tr>
				<tr mat-row *matRowDef="let row; columns: ['stt', 'month', 'date', 'action']"></tr>
			</table>
		</div>
	</mat-card-content>
</mat-card>

<div [class.active]="showDialogCreate" class="add-new-popup">
	<div class="popup-dialog">
		<mat-card class="border-radius d-block bg-white border-0 shadow-none container max-width-300">
			<mat-card-header>
				<mat-card-title>
					<h5 class="mb-0">
						<span i18n>Edit</span>
					</h5>
				</mat-card-title>
				<mat-card-subtitle>
					<button (click)="closeDetail()" mat-button>
						<i class="ri-close-fill"></i>
					</button>
				</mat-card-subtitle>
			</mat-card-header>
			<mat-card-content class="p-0">
				<form [formGroup]="formGroupDetail" autocomplete="off">
					<div class="row">
						<div class="col-12 mb-2" sizeInput="sm">
							<mat-form-field>
								<mat-label i18n>Month</mat-label>
								<input matInput formControlName="month" type="text" [disabled]="true" />

							</mat-form-field>
						</div>
						<div class="col-12 mb-2" sizeInput="sm">
							<mat-form-field>
								<mat-label i18n>Date</mat-label>
								<input matInput formControlName="date" type="text"/>
								<mat-error *ngIf="formGroupDetail.controls['date'].getError('invalid')" i18n>
									{{ formGroupDetail.controls['date'].getError('message') }}
								</mat-error>
							</mat-form-field>
						</div>
					</div>
				</form>
			</mat-card-content>
			<mat-card-footer>
				<div class="btn-box">
					<button (click)="closeDetail()" class="close-btn mr-10" i18n mat-button type="button">
						<i class="material-symbols-outlined">
							close
						</i>
						Close
					</button>
					<button (click)="saveData()" class="add-btn" i18n mat-button>
						<i class="material-symbols-outlined">
							save
						</i>
						Save
					</button>
				</div>
			</mat-card-footer>
		</mat-card>
	</div>
</div>
