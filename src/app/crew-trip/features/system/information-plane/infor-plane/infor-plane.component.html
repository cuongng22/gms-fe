<!-- Breadcrumb -->
<div class="breadcrumb-card mb-10 d-md-flex align-items-center justify-content-between">
    <h5 class="mb-0" i18n="@@crewList">
      Air craft data list
    </h5>
    <ol class="breadcrumb list-unstyled mt-0 mb-0 p-0">
      <li class="breadcrumb-item d-inline-block position-relative" i18n="@@system">
        System
      </li>
      <li class="breadcrumb-item d-inline-block position-relative" i18n="@@config">
        Config
      </li>
    </ol>
  </div>

  <!--Search-->
  <mat-card class="mb-10 pt-15 pl-15 pr-15 pb-0 border-radius d-block bg-white border-0 shadow-none">
    <mat-card-content>
      <form [formGroup]="formGroupSearch" (ngSubmit)="search()" autocomplete="off">
        <div class="row">
          <div class="col-xs-12 col-sm-12 col-md-12 col-lg-12">
            <div class="row mb-3">
              <div class="col-4" sizeInput="md">
                <mat-form-field class="mb-1">
                  <mat-label i18n="@@keywords">Keywords</mat-label>
                  <input matInput formControlName="s">
                </mat-form-field>
              </div>
              <div class="col" sizeInput="md">
                <mat-form-field class="mb-1">
                  <mat-label i18n="@@type">Type</mat-label>
                  <mat-select formControlName="type">
                    <mat-option [value]="null" i18n="@@allStatus">-- All Type --</mat-option>
                    <mat-option value="Crew" i18n="@@crew">Crew</mat-option>
                    <mat-option value="Extra Crew" i18n="@@extraCrew">Extra Crew</mat-option>
                  </mat-select>
                </mat-form-field>
              </div>
              <div class="col d-sm-flex flex-row  justify-content-lg-start justify-content-md-center">
                <mat-card-header class="mb-0 search">
                  <mat-card-title>
                    <button class="search-btn" type="submit" mat-button>
                      <i class="material-symbols-outlined">
                        search
                      </i>
                      <span i18n="@@search">Search</span>
                    </button>
                  </mat-card-title>
                </mat-card-header>
              </div>
            </div>
          </div>
        </div>
      </form>
    </mat-card-content>
  </mat-card>

  <!-- Start Danh sách Tổ bay  -->

  <mat-card class="mb-10 p-15 border-radius d-block bg-white border-0 shadow-none">
    <mat-card-header class="mb-10">
      <mat-card-title>
        <h5 i18n="@@groupMailList">Air craft data list</h5>
      </mat-card-title>
      <mat-card-subtitle>
<!--        <button class="add-btn mr-10" type="button" mat-button (click)="grMailDetail()">-->
<!--          <i class="material-symbols-outlined">-->
<!--            download-->
<!--          </i>-->
<!--          <span i18n="@@export">Export</span>-->
<!--        </button>-->
        <button class="add-btn" type="button" mat-button (click)="createAirplane()">
          <i class="material-symbols-outlined">
            add
          </i>
          <span i18n="@@create">Create</span>
        </button>
      </mat-card-subtitle>
    </mat-card-header>
    <mat-card-content>
      <div class="table-responsive">
        <table mat-table [dataSource]="dataSource" class="mat-elevation-z8 shadow-none">

          <!-- Số thứ tự Column -->
          <ng-container matColumnDef="index">
            <th mat-header-cell *matHeaderCellDef> # </th>
            <td mat-cell *matCellDef="let element; let i = index"> {{i + 1}} </td>
          </ng-container>

          <!-- AC Group Column -->
          <ng-container matColumnDef="acGroup">
            <th mat-header-cell *matHeaderCellDef> AC Group </th>
            <td mat-cell *matCellDef="let element"> {{element.acgroup}} </td>
          </ng-container>

          <!-- AC Type Column -->
          <ng-container matColumnDef="acType">
            <th mat-header-cell *matHeaderCellDef> AC Type </th>
            <td mat-cell *matCellDef="let element"> {{element.actype}} </td>
          </ng-container>

          <!-- Note Column -->
          <ng-container matColumnDef="note">
            <th mat-header-cell *matHeaderCellDef> Note </th>
            <td mat-cell *matCellDef="let element"> {{element.note}} </td>
          </ng-container>

          <!-- Status Column -->
          <ng-container matColumnDef="status">
            <th mat-header-cell *matHeaderCellDef> Status </th>
            <td mat-cell *matCellDef="let element"> {{element.status}} </td>
          </ng-container>

          <!-- Action Column -->
          <ng-container matColumnDef="action">
            <th mat-header-cell *matHeaderCellDef> Action </th>
            <td mat-cell *matCellDef="let element">
              <button mat-icon-button color="warn">
                <i _ngcontent-ng-c2661835730="" title="Edit" class="material-symbols-outlined text-secondary"> edit </i>

              </button>
              <button mat-icon-button color="warn">
                <i _ngcontent-ng-c460172516="" class="material-symbols-outlined"> delete </i>
                <!-- <mat-icon>delete</mat-icon> -->
              </button>

            </td>
          </ng-container>


          <!-- Header và Row -->
          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        </table>
        <mat-paginator
          (page)="onPageChange($event)"
          [length]="totalElement"
          [pageIndex]="pageIndex"
          [pageSizeOptions]="pageSizeOptions"
          [pageSize]="pageSize"
          [showFirstLastButtons]="showFirstLastButtons"
          aria-label="Select page">
        </mat-paginator>
      </div>

    </mat-card-content>


  </mat-card>
