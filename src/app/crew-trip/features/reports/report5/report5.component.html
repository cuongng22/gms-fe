<!-- Breadcrumb -->
<div class="breadcrumb-card mb-10 d-md-flex align-items-center justify-content-between">
    <h5 class="mb-0" i18n="@@hotel">
<!--      Cost savings report-->
    </h5>
    <ol class="breadcrumb list-unstyled mt-0 mb-0 p-0">
      <li class="breadcrumb-item d-inline-block position-relative" i18n="@@category">
        Reports
      </li>
      <li class="breadcrumb-item d-inline-block position-relative" i18n="@@hotel">
        Cost savings report
      </li>
    </ol>
  </div>
<mat-card class="mb-10 p-15 border-radius d-block bg-white border-0 shadow-none">
  <mat-card-header>
    <mat-card-title>
    </mat-card-title>
    <mat-card-subtitle>
      <button (click)="loadReport(true)" class="add-btn" i18n mat-button
              type="button">
        <i class="material-symbols-outlined">
          refresh
        </i>
        Refresh data
      </button>
    </mat-card-subtitle>
  </mat-card-header>
  <mat-card-content style="width:100%; height:80vh">
    <iframe width="100%" height="100%" [src]="iframeUrl"
            referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
  </mat-card-content>
</mat-card>
